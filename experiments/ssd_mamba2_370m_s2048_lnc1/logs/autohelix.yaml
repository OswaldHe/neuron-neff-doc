# Optimize a compiled NEFF by editing the NEFF itself -- no source, no recompile.
# Generated by gdn-bench/tools/prepare_loop.py for case ssd_mamba2_370m_s2048.
goal: |
  Make `kernel.neff` execute faster on the device without changing what it computes.

  `kernel.neff` is the compiled NEFF of the nkilib kernel `nkilib.experimental.scan.ssd` -- Mamba-2 state-space duality scan (chunked) -- for
  batch 1, nheads 48, seqlen 2048, headdim 32, dstate 64, chunk_size 128, use_D False, use_initial_state False, dtype float32, on one logical NeuronCore at LNC=1 (one physical core), one rank. The unedited NEFF and
  its measurements are in `baseline/`; measure the current one yourself rather than trusting any
  number written down here.

  THE ONLY FILE YOU MAY CHANGE IS `kernel.neff`. There is no kernel source in this repo and
  recompiling one is not the task: the work is to edit the compiled binary. Every other file
  (tools/, bench/, baseline/) is reverted before your iteration is judged.

  ## How to edit a NEFF

  Everything you need is documented in `/home/ubuntu/workspace/neff_doc` -- read it, do not
  guess. Start with its `README.md`, then:

    chapter 14  optimization playbook: how to find where the time goes
    chapter 13  editing guide: the modify/run/check/measure procedure and a worked example
    chapter 10  synchronisation: the semaphore model and the rules an edit must respect
    chapter  6  the 64-byte instruction slot; chapter 7 what each instruction's fields mean
    chapter  9  DMA (queued and DGE); chapter 5 SBUF/PSUM addressing
    chapter  4  the definition file and the variable table
    chapter 15  the tools, with what each one is for

  `neff_doc/experiments/` holds finished runs of this same loop on other kernels, with their
  per-iteration notes: what worked, what was refuted, and the measurement that closed it. Those
  kernels are not this one, so check any claim against your own profile before relying on it.

  The tools live in `/home/ubuntu/workspace/neff_doc/tools/`. Use them; they are tested:

    neff.py unpack kernel.neff work/      unpack (payload/sgNN/<Engine>0.bin are the streams)
    isa.py work/payload/sg00/DVE0.bin     decode every instruction slot, by vendor field name
    semaphores.py work sg00               check no wait can exceed its supply (catches hangs)
    neff.py pack work/ kernel.neff        repack (recomputes the header size and both MD5s)
    neff_diff.py baseline/kernel.neff kernel.neff     see exactly which bytes/fields you changed

  Run them with `/home/ubuntu/workspace/.venv/bin/python`.

  ## The loop's rules

  * `tools/verify.py` must pass: the NEFF runs on the device with fixed inputs and every output
    must stay within the `max_abs_err_limit` in `bench/manifest.json` of the torch golden. The
    unedited NEFF already spends most of that budget (`baseline/verify_baseline.json`; the
    verifier prints how much of the limit each output uses), so an edit that changes the
    arithmetic will fail.
  * `tools/launch_rules.py` must pass: still exactly 1 subgraph(s) (`sg00`), no collectives,
    no replica groups, `num_tpb == 1`, same inputs and output heads. Using more cores or more
    ranks than the baseline would lower the metric by spending more hardware rather than by
    making the kernel better, so it is rejected.
  * The metric is `total_exec_time_us` from `tools/profile.py` (median of 5 captures)
    and LOWER IS BETTER. An iteration that regresses it by more than 2% is rejected.

  ## Finding where the time goes

  Measure the NEFF you are holding; do not work from remembered numbers, they go stale as the
  loop changes the NEFF. `tools/profile.py` prints the per-engine busy time and writes
  `profile_latest.json`; `baseline/profile_baseline.json` is the unedited NEFF for comparison.
  `tools/profile.py --parquet prof` ingests the profile into `prof/Instruction.parquet`
  (`engine`, `pcore_idx`, `compiler_pc`, `opcode`, `duration_ns`, `start_ts`,
  `end_ts`) so you can find the slots that actually cost time, and chapter 11 maps a slot back
  to its NKI line. What the numbers mean for this kernel, and what is worth attacking, is yours
  to work out from the measurement -- the notes and the review carry what earlier iterations
  already settled.

  This kernel runs in about 5249 us. check the spread `tools/profile.py` reports before believing a small win.

  ## Working method

  1. Measure or read the current profile before changing anything.
  2. Form one hypothesis, name the slots it touches, and predict the effect.
  3. Make the smallest edit that tests it. Check `semaphores.py`, then `verify.py`,
     then `profile.py`.
  4. Write what you learned in `notes/` -- iterations are isolated and `notes/` is the only
     thing that survives, including after a rejected iteration. Record failures too: a lever
     that turns out to be closed is worth as much as a win.
  5. If an edit is wrong, `cp baseline/kernel.neff kernel.neff` and start again.

  Do not claim a win you cannot separate from the run-to-run spread; repeat the measurement
  instead.

constraints:
  - /home/ubuntu/workspace/.venv/bin/python tools/launch_rules.py
  - /home/ubuntu/workspace/.venv/bin/python tools/verify.py

metrics:
  - command: /home/ubuntu/workspace/.venv/bin/python tools/profile.py --repeats 5
    values:
      total_exec_time_us: lower
    capture:
      - profile_latest.json
      - verify_latest.json
    timeout: 1800

acceptance:
  metric_gates:
    - metric: total_exec_time_us
      max_regression_pct: 2

scope:
  editable: [kernel.neff]

reviewer:
  # A different model from the agent, so the review is a second opinion rather than the same
  # reasoning checked against itself.
  model: claude-sonnet-5-5
  prompt: |
      You are reviewing one iteration of a loop whose single job is to make a compiled Trainium
      NEFF (`kernel.neff`, the nkilib kernel `nkilib.experimental.scan.ssd`, LNC=1 so `sg00`, one rank) execute
      faster without changing its numbers. Only `kernel.neff` is editable. The iteration is
      accepted if `tools/verify.py` (every output within `max_abs_err_limit` of a torch golden)
      and `tools/launch_rules.py` (unchanged launch shape and interface) pass, and it is scored on
      `total_exec_time_us` from `tools/profile.py` -- lower is better.

      The diff is a binary file, so read it with the tools instead of the patch:

        /home/ubuntu/workspace/.venv/bin/python /home/ubuntu/workspace/neff_doc/tools/neff_diff.py \
            baseline/kernel.neff kernel.neff

      which prints which package members, instruction slots and decoded fields changed. Also read
      `profile_latest.json` (this iteration) against `baseline/profile_baseline.json` (the
      unedited NEFF), `verify_latest.json`, and the agent's `notes/`.

      Answer, briefly and concretely:

      1. What did this iteration actually change in the NEFF, in terms of slots and fields -- and
         is that change consistent with what the notes claim was done?
      2. Is the measured latency change real? Compare the medians and the spread in
         `profile_latest.json`, and say plainly if the loop is chasing noise. This kernel is
         about 5249 us, so check the spread `tools/profile.py` reports before believing a small win.
      3. Is the edit safe beyond the verifier? Look for synchronisation that was loosened
         (removed or reduced semaphore waits can pass once and race later -- run
         `/home/ubuntu/workspace/.venv/bin/python /home/ubuntu/workspace/neff_doc/tools/semaphores.py` on an unpacked copy),
         and for error that moved close to the limit.
      4. THE MAIN ANSWER: a ranked list of candidate edits for the next iteration -- three to six
         of them, best first, judged from the profile and from the NEFF rather than from
         intuition. The next agent starts from this list, so make it specific enough to act on.
         For each candidate give, in a table or one short block each:

           * the engine and package member, and which slots or descriptors;
           * what exactly changes -- the field and its new value, or the structural change;
           * the mechanism it relies on, and where that mechanism is documented or was
             established on the device;
           * the expected gain AND its measured ceiling, with where that ceiling comes from
             (which profile number bounds it). "Unknown" is an acceptable ceiling if you say so;
           * the risk: what it could break, and whether the verifier would catch it (an
             allocation or synchronisation change can pass one fixed input set and still be
             wrong);
           * the cheapest check that would falsify it, so a bad candidate dies in minutes
             rather than consuming the iteration.

         Rank by expected gain per unit of risk and effort, not by gain alone. Then add two short
         lists: **closed** -- levers already refuted by measurement in `notes/` or in an earlier
         review, with the number that closed them, so the next agent does not redo them; and
         **unknown** -- things that would change the ranking if they were measured, and the
         measurement that would settle each.

         Use the per-instruction table where it helps:
         `/home/ubuntu/workspace/.venv/bin/python tools/profile.py --repeats 1 --parquet prof`
         then read `prof/Instruction.parquet` (engine, pcore_idx, compiler_pc, opcode,
         duration_ns, start_ts, end_ts).

         If the evidence says the remaining time is irreducible at the NEFF level, say that
         plainly and keep the list short or empty -- do not invent levers to fill it.
budget:
  iterations: 7
  iteration_time: 2h
